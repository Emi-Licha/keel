apiVersion: v1
kind: Pod
metadata:
  name: $pod_name
  namespace: $namespace
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: probe
      image: $image
      imagePullPolicy: Never
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      command: [python, -c]
      args:
        - |
          import socket
          address = socket.gethostbyname('payments.keel-apps.svc.cluster.local')
          try:
              socket.create_connection((address, 8080), timeout=4).close()
              print('ALLOWED')
          except TimeoutError:
              print('DENIED')
