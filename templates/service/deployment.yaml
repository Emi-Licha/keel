apiVersion: apps/v1
kind: Deployment
metadata:
  name: $service_name
  labels:
    app.kubernetes.io/name: $service_name
    app.kubernetes.io/part-of: keel
  annotations:
    keel/owner: $owner
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: $service_name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: $service_name
        app.kubernetes.io/part-of: keel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: $image
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          failureThreshold: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          failureThreshold: 10
